name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm coverage

  e2e:
    # Browser tests against the production build (relay serving the built web app).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @collabpad/frontend build
      - run: pnpm start > relay.log 2>&1 &
        env:
          DB_PATH: ':memory:'
      - name: Wait for the relay
        run: for i in $(seq 1 30); do curl -sf localhost:8787/healthz && exit 0; sleep 1; done; exit 1
      - run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:8787
      - if: failure()
        run: cat relay.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
