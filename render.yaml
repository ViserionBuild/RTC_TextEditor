# Render blueprint (free plan): Render dashboard → New → Blueprint → pick this repo.
# Builds the Dockerfile from the default branch and serves the app on https://<name>.onrender.com
#
# Free instances have no persistent disk and sleep when idle, so documents reset when the
# instance restarts. For durable storage use a paid plan and add:
#   disk: { name: collabpad-data, mountPath: /data, sizeGB: 1 }
# Run a single instance: rooms live in memory and SQLite is a local file.
services:
  - type: web
    name: collabpad
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOG_LEVEL
        value: info
